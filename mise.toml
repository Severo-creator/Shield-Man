
[tools]
java = "21"
maven = "3.9"

[tasks.build]
description = "Compilar os projetos Java"
run = "mvn clean package -DskipTests"

[tasks.test]
description = "Executar os testes Java"
run = "mvn test"

[tasks.up]
description = "Subir PostgreSQL e aplicação"
run = "docker compose up -d"

[tasks.down]
description = "Parar o ambiente preservando os dados"
run = "docker compose down"

[tasks.logs]
description = "Acompanhar os logs da aplicação"
run = "docker compose logs -f api"