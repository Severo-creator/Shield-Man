quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/shieldman}
quarkus.datasource.username=${DB_USER:shieldman}
quarkus.datasource.password=${DB_PASSWORD:senha_local_de_desenvolvimento}

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Documentação gerada a partir das rotas, disponível também no aplicativo empacotado.
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=target/openapi
